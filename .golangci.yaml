version: "2"
# This file configures every module in the repository. golangci-lint run from
# a nested module, such as fit or circuit, finds it by searching the parent directories,
# and every path below is relative to this file rather than to the module.
run:
  timeout: 5m
  tests: true
  relative-path-mode: cfg
linters:
  enable:
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        # Library code of the bedrock module imports only the standard
        # library, and bedrock's own packages. Tests may use any module.
        bedrock:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!${base-path}/fit/**"
            - "!${base-path}/circuit/**"
          allow:
            - $gostd
            - github.com/z5labs/bedrock
          deny:
            - pkg: github.com/z5labs/bedrock/fit
              desc: the bedrock module does not depend on the fit module
            - pkg: github.com/z5labs/bedrock/circuit
              desc: the bedrock module does not depend on the circuit module
        # Library code of the fit module imports only the standard library
        # and OpenTelemetry's baggage. It does not import the bedrock module.
        # Tests may use any module.
        fit:
          list-mode: strict
          files:
            - "${base-path}/fit/**"
            - "!$test"
          allow:
            - $gostd
            - go.opentelemetry.io/otel/baggage
        # Library code of the circuit module imports only the standard
        # library. It does not import the bedrock module or the fit module.
        # Tests may use any module.
        circuit:
          list-mode: strict
          files:
            - "${base-path}/circuit/**"
            - "!$test"
          allow:
            - $gostd
    forbidigo:
      # Examples are documentation that users copy, so they are held to the
      # same rule as everything else.
      exclude-godoc-examples: false
      forbid:
        # An App reaches its OS process only through the bedrock.Process it is
        # run with. Only the OS edge, os.go, reads the real process or exits it.
        - pattern: ^os\.(Args|Stdin|Stdout|Stderr|Getenv|LookupEnv|Environ|Exit)$
          msg: read the process through bedrock.Process, and exit by returning a bedrock.ExitStatus; only os.go touches the real process
        - pattern: ^signal\.Notify
          msg: listen for signals through Process.NotifyContext; only os.go touches the real process
        - pattern: ^flag\.(Parse|CommandLine)$
          msg: parse p.Args[1:] with a flag.FlagSet of your own, using flag.ContinueOnError and p.Stderr as its output
  exclusions:
    rules:
      # The OS edge, and its tests, which check it against the real process.
      - path: ^os(_test)?\.go$
        linters:
          - forbidigo
      # Runs one table against the real signal.NotifyContext and the fake, so
      # that the fake cannot drift from what it stands in for.
      - path: ^bedrocktest/conformance_unix_test\.go$
        linters:
          - forbidigo
