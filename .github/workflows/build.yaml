name: CI

on:
  push:
    branches:
      - "main"
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'

  pull_request:
    branches:
      - "main"

  merge_group:

jobs:
  # The default branch requires a status check named exactly Build, so every
  # module is checked by this one job rather than by a matrix, which would
  # rename the check. `./...` does not descend into a nested module, so each
  # module has its own steps. Each step after the first runs even when an
  # earlier one failed, so one run reports every failure in every module, and
  # the job fails if any step failed.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27'
            cache-dependency-path: '**/go.sum'

        - name: Lint Go Code (bedrock)
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            skip-cache: false

        - name: Lint Go Code (fit)
          if: ${{ !cancelled() }}
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            skip-cache: false
            working-directory: fit

        - name: Lint Go Code (circuit)
          if: ${{ !cancelled() }}
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            skip-cache: false
            working-directory: circuit

        - name: Lint Go Code (retry)
          if: ${{ !cancelled() }}
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            skip-cache: false
            working-directory: retry

        - name: Lint Go Code (host)
          if: ${{ !cancelled() }}
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            skip-cache: false
            working-directory: host

        - name: Report golangci-lint version
          if: ${{ !cancelled() }}
          run: golangci-lint version

        - name: Build (bedrock)
          if: ${{ !cancelled() }}
          run: go build ./...

        - name: Build (fit)
          if: ${{ !cancelled() }}
          run: go -C fit build ./...

        - name: Build (circuit)
          if: ${{ !cancelled() }}
          run: go -C circuit build ./...

        - name: Build (retry)
          if: ${{ !cancelled() }}
          run: go -C retry build ./...

        - name: Build (host)
          if: ${{ !cancelled() }}
          run: go -C host build ./...

        - name: Vet (bedrock)
          if: ${{ !cancelled() }}
          run: go vet ./...

        - name: Vet (fit)
          if: ${{ !cancelled() }}
          run: go -C fit vet ./...

        - name: Vet (circuit)
          if: ${{ !cancelled() }}
          run: go -C circuit vet ./...

        - name: Vet (retry)
          if: ${{ !cancelled() }}
          run: go -C retry vet ./...

        - name: Vet (host)
          if: ${{ !cancelled() }}
          run: go -C host vet ./...

        - name: Test (bedrock)
          if: ${{ !cancelled() }}
          run: go test -race -cover ./...

        - name: Test (fit)
          if: ${{ !cancelled() }}
          run: go -C fit test -race -cover ./...

        - name: Test (circuit)
          if: ${{ !cancelled() }}
          run: go -C circuit test -race -cover ./...

        - name: Test (retry)
          if: ${{ !cancelled() }}
          run: go -C retry test -race -cover ./...

        - name: Test (host)
          if: ${{ !cancelled() }}
          run: go -C host test -race -cover ./...

        - name: Test release tagging script
          if: ${{ !cancelled() }}
          run: .github/scripts/tag-modules_test.sh
