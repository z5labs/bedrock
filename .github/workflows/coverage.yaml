name: Coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Report coverage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Run tests with coverage
        run: go test ./... -covermode=count -coverprofile=coverage.out | tee coverage.txt

      - name: Write coverage to the job summary
        run: |
          {
            echo '## Coverage'
            echo
            echo '### Per package'
            echo
            echo '```'
            grep -E '^(ok|---|FAIL|\?)' coverage.txt || true
            echo '```'
            echo
            echo '### Per function'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
